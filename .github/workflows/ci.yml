name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Normalize formatting
        run: |
          gofmt -w ./cmd
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add cmd
            git commit -m "gofmt M2.3 implementation"
            git push
          fi

      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/number-station-tools

      - name: Build container
        run: docker build -f Containerfile -t number-station-tools:ci .

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Check formatting
        run: |
          files="$(gofmt -l ./cmd)"
          printf '%s\n' "$files"
          test -z "$files"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/number-station-tools

      - name: Build container
        run: docker build -f Containerfile -t number-station-tools:ci .

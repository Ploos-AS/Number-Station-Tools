name: M3.1 integrate

on:
  push:
    branches: [work/m3.1-recording-api-ui]
    paths: [.m31-trigger]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/m3.1-recording-api-ui
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Apply integration patch
        run: |
          python3 tools/m31_patch.py
          gofmt -w cmd/number-station-tools/main.go cmd/number-station-tools/recordings.go cmd/number-station-tools/recording_api.go
          rm -f .m31-trigger tools/m31_patch.py .github/workflows/m31-integrate.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "M3.1: integrate recording API into server"
          git push
